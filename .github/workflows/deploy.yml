name: Deploy to Cloud Run

on:
  push:
    branches: [main]

# GitHub Variables (Settings → Secrets and variables → Variables):
#   GCP_PROJECT_ID       — your Google Cloud project ID
#   GCP_REGION           — e.g. us-central1
#   CLOUD_RUN_SERVICE    — e.g. anuvia
#   APP_NAME             — e.g. anuvia
#   ARTIFACT_REPOSITORY  — Artifact Registry repo name, e.g. containers
#
# GitHub Secrets (Settings → Secrets and variables → Secrets):
#   WIF_PROVIDER         — Workload Identity provider resource name
#                          (projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER)
#   WIF_SERVICE_ACCOUNT  — deployer SA email (github-deployer@PROJECT.iam.gserviceaccount.com)
#   SECRET_KEY           — JWT signing secret (min 32 chars)
#   DATABASE_URL         — postgresql+asyncpg://user:password@ep-xxx.neon.tech/neondb
#   STRIPE_SECRET_KEY    — (optional)
#   STRIPE_WEBHOOK_SECRET — (optional)
#
# Authentication is keyless via Workload Identity Federation — there is no
# service account key. See cloud/github-actions.md for the one-time GCP setup.
# The image is pushed to Artifact Registry (not the deprecated gcr.io).

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE:    ${{ vars.CLOUD_RUN_SERVICE }}
  REGION:     ${{ vars.GCP_REGION }}
  IMAGE:      ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Authenticate to Google Cloud with a short-lived OIDC token (no key).
      # GitHub presents the token; Google exchanges it for temporary credentials
      # scoped to the deployer service account. See cloud/github-actions.md.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          # UTC time of this deploy. /health renders it in IST so a deploy is
          # visible without opening GitHub.
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gcloud run deploy $SERVICE \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "APP_NAME=${{ vars.APP_NAME }}" \
            --set-env-vars "APP_ENV=production" \
            --set-env-vars "DEBUG=false" \
            --set-env-vars "DEPLOYED_AT=${DEPLOYED_AT}" \
            --set-env-vars "SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" \
            --set-env-vars "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"

      - name: Show deployed URL
        run: |
          URL=$(gcloud run services describe $SERVICE --region $REGION --format 'value(status.url)')
          echo "Deployed to: $URL"
